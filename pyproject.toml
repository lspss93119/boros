[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boros-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0,<2",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["boros_research*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
