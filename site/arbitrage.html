<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歷史套利研究</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./arbitrage.css">
</head>
<body>
  <div id="arbitrageApp">
    <header class="topbar">
      <div>
        <h1 id="pageTitle" data-zh="歷史套利研究">歷史套利研究</h1>
        <p id="pageSubtitle">以精確市場結構查看 Boros 固定利率可成交利差的歷史研究。</p>
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="./index.html">APR Research</a>
        <button id="languageToggle" type="button">English</button>
      </div>
    </header>

    <section class="filters" id="filterBar" aria-label="Arbitrage research filters">
      <label>
        <span id="assetLabel">資產</span>
        <select id="assetSelect"></select>
      </label>
      <label>
        <span id="directionLabel">方向</span>
        <select id="directionSelect"></select>
      </label>
      <label>
        <span id="expirationLabel">到期日</span>
        <select id="expirationSelect"></select>
      </label>
      <label id="marketFilter" hidden>
        <span id="marketLabel">市場</span>
        <select id="marketSelect"></select>
      </label>
      <label>
        <span id="notionalLabel">名目金額</span>
        <select id="notionalSelect"></select>
      </label>
    </section>

    <main>
      <section class="kpis" id="kpis" aria-label="Historical arbitrage KPIs"></section>

      <section class="panel chart-panel">
        <div class="panel-title">
          <div>
            <h2 id="historyTitle">可成交利差歷史</h2>
            <p id="historySubtitle">僅顯示每日彙總；缺少的 UTC 日期不會被連線。</p>
          </div>
          <div class="chart-tabs" role="tablist" aria-label="Historical spread view">
            <button class="active" id="spreadTab" data-view="spread" type="button">可成交利差</button>
            <button id="percentileTab" data-view="percentile" type="button">90天百分位</button>
          </div>
        </div>
        <div class="chart-shell arbitrage-chart-shell">
          <canvas id="spreadChart" width="1180" height="430"></canvas>
        </div>
        <p class="chart-note" id="historyNote">每日中位數與每日最高值只使用完整可成交觀察。</p>
      </section>

      <section class="panel distribution-panel">
        <div class="panel-title">
          <div>
            <h2 id="distributionTitle">歷史分布</h2>
            <p id="distributionSubtitle">90天完整可成交利差分布。</p>
          </div>
        </div>
        <div class="chart-shell arbitrage-chart-shell">
          <canvas id="distributionChart" width="1180" height="360"></canvas>
        </div>
        <div class="distribution-meta" id="distributionMeta"></div>
      </section>

      <section class="panel" id="notionalComparison">
        <div class="panel-title">
          <div>
            <h2 id="notionalTitle">名目金額比較</h2>
            <p id="notionalSubtitle">三種規模使用同一個精確歷史時間戳。</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="notionalHead">名目金額</th>
                <th id="spreadHead">可成交利差</th>
                <th id="rankHead">90天排名</th>
                <th id="sampleHead">90天樣本</th>
                <th id="statusHead">成交狀態</th>
              </tr>
            </thead>
            <tbody id="notionalComparisonBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="leaderboard">
        <div class="panel-title">
          <div>
            <h2 id="leaderboardTitle">歷史套利機會排行榜</h2>
            <p id="leaderboardSubtitle">最新歷史狀態，依 90天排名排序。</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="assetHead">資產</th>
                <th id="directionHead">方向</th>
                <th id="expirationHead">到期日</th>
                <th id="dteHead">DTE</th>
                <th id="leaderSpreadHead">可成交利差</th>
                <th id="leaderRankHead">90天排名</th>
                <th id="leaderSampleHead">90天樣本</th>
                <th id="leaderStatusHead">成交狀態</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="./arbitrage.js"></script>
</body>
</html>
